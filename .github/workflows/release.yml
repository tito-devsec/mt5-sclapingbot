name: Release

on:
  push:
    tags: ["v*.*.*"]

# Default to read-only; only the release job below may write (to create the release and upload assets).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version ${version}"; exit 1; }
      - name: Lint, type check and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,boost,regime,online,tuning,explain,uncertainty]"
          ruff check src tests
          mypy src
          python -m pytest -q
      - name: Build package and MQL5 bundle
        run: |
          python -m pip install build
          python -m build
          (cd mql5 && zip -r "../dist/mt5bot-mql5-${GITHUB_REF_NAME}.zip" Include Indicators Experts Scripts)
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp .github/RELEASE_HEADER.md notes.md
          awk -v ver="$v" 'index($0, "## [" ver "]") == 1 {f=1; next} f && /^## \[/ {exit} f {print}' CHANGELOG.md > section.md
          test -s section.md
          cat section.md >> notes.md
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "mt5-sclapingbot ${GITHUB_REF_NAME} (research pre-release)" \
            --notes-file notes.md --prerelease --verify-tag
